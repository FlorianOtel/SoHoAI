# llama-swap--config.yaml

# Explicit health-check timeout for slow NFS model loads with --no-mmap.
# 5.97 GB (9B) at ~200-500 MB/s NFS → 12-30 s load time; 180 s gives ample headroom.
healthCheckTimeout: 180

models:

#### Qwen3.5-4B-Q6
  qwen3.5-4b-q6:
    cmd: |
      llama-server -m /mnt/nfs/Florian/Gin-AI/LLMs-cache/llama-server/Qwen3.5-4B-UD-Q6_K_XL.gguf --jinja --flash-attn on --no-mmap --cache-type-k q8_0 --cache-type-v q8_0 -ngl 99 --ctx-size 262144 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --host 0.0.0.0 --port 8010
    proxy: http://127.0.0.1:8010
    ttl: 300  # on-demand since 2026-09-17; currently unreferenced by SoHoAI and opencode.json

#### bge-reranker-v2-m3 — cross-encoder reranker for RAG retrieval (SoHoAI rag.rerank)
# Measured: 518-590 MiB VRAM. Small enough to sit alongside the 9B all day,
# which is why it shares the "resident" group below rather than swapping.
# -c 768 -b 768 -ub 768 keeps context and both batch sizes consistent, so no
# client-side truncation is needed for typical queries + child chunks.
# Reached by SoHoAI at http://192.168.1.95:8000/v1/rerank — llama-swap routes
# /v1/rerank by the request's "model" field, so this key must stay in sync with
# rag.rerank.model in SoHoAI-config.yaml.
  bge-reranker-v2-m3:
    cmd: |
      llama-server -m /mnt/nfs/Florian/Gin-AI/LLMs-cache/llama-server/bge-reranker-v2-m3-q8_0.gguf --no-mmap -ngl 99 -c 768 -b 768 -ub 768 --reranking --pooling rank --host 0.0.0.0 --port 8012
    proxy: http://127.0.0.1:8012
    ttl: 0  # never idle-evicted; only the 9B group can push it off the GPU

#### Qwen3.5-9B-Q4
# Hybrid attention (full_attention_interval=4): only 8/32 layers store KV for all tokens.
# Effective KV/token (q8_0) = 2×8 layers×4 KV heads×256 head_dim×1.0625 = 17,408 bytes.
# MEASURED: @262144 ctx = 10,796 MiB, which CANNOT coexist with the reranker (llama-server
# segfaults during CUDA init). @131072 ctx = 8,382 MiB, which CAN: 9B + reranker + Ollama
# bge-m3 = 9,810 MiB of the card's 12,227, leaving 1,965 free. Verified 2026-09-17 by a
# 10-min concurrent soak (generation + rerank + embed): 30/30 samples, 0 errors.
# --reasoning off makes thinking-suppressed the default; a request carrying
# chat_template_kwargs.enable_thinking overrides it either way (see local/qwen3.5-9b-agentic
# in SoHoAI-config.yaml). This is the configuration that scored 0/150 on AYA Gate G0.
  qwen3.5-9b-q4:
    cmd: |
      llama-server -m /mnt/nfs/Florian/Gin-AI/LLMs-cache/llama-server/Qwen3.5-9B-UD-Q4_K_XL.gguf --jinja --reasoning off --flash-attn on --no-mmap --cache-type-k q8_0 --cache-type-v q8_0 -ngl 99 --ctx-size 131072 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --host 0.0.0.0 --port 8011
    proxy: http://127.0.0.1:8011
    ttl: 0  # resident default since 2026-09-17 (was 300); routing.default_model points here

groups:
#### Default GPU tenants: the 9B chat model and the reranker, loaded together.
# swap: false      -> members do NOT evict each other; both stay resident at once.
# exclusive: true  -> requesting either one evicts every OTHER group (i.e. the 4B).
  resident:
    members:
      - "qwen3.5-9b-q4"  # <-- list items need "-"
      - "bge-reranker-v2-m3"
    swap: false
    exclusive: true

#### The 4B is on-demand. exclusive: true -> requesting it evicts the resident group
# (9B + reranker), so it costs a full swap. Nothing routes to it since 2026-09-17.
  ondemand:
    members:
      - "qwen3.5-4b-q6"
    swap: true
    exclusive: true

# The secret sauce for "Always On"
#### (!!!) 2026-05-16 :  Apparently this is NOT working yet -- i.e. there is no ability to bring back "default" model after TTL is expired -- 5mins for Qwen3.5-9B-Q4 -- and is removed from the GPU VRAM.
#### Leaving it commented though...
#### 2026-08-27 re-check: still no eviction hook in llama-swap v214 — the only hook
#### is hooks.on_startup.preload. After the 9B's TTL expires the GPU sits empty until
#### the next request, which then pays the cold-load cost (~45 s for the 4B over NFS,
#### ~15 s for the reranker). Both DO come back automatically, just lazily.

# fallback:
#  default: "qwen3.5-4b-q6" # Automatically reloads the 4B model when the 9B model unloads/expires

hooks:
  on_startup:
    preload:
      - "qwen3.5-9b-q4"       # boot the 9B (the resident default) on startup
      - "bge-reranker-v2-m3"  # ...and the reranker alongside it

