# llama-swap--config.yaml

# Explicit health-check timeout for slow NFS model loads with --load-mode none.
# 5.97 GB (9B) at ~200-500 MB/s NFS → 12-30 s load time; 180 s gives ample headroom.
healthCheckTimeout: 180

models:

#### Qwen3.5-4B-Q6 — REMOVED 2026-09-18.
# It had been unreferenced since the 9B became the resident default: retired from
# SoHoAI-config.yaml's model_list and from opencode.json, so nothing could route to it,
# while llama-swap still stood ready to launch it and evict the resident pair to do so.
# The GGUF remains at LLMs-cache/llama-server/Qwen3.5-4B-UD-Q6_K_XL.gguf, so restoring it
# is a config-only change: re-add the entry on port 8010 plus its own group.

#### bge-reranker-v2-m3 — cross-encoder reranker for RAG retrieval (SoHoAI rag.rerank)
# Measured: 518-590 MiB VRAM. Small enough to sit alongside the 9B all day,
# which is why it shares the "resident" group below rather than swapping.
# -c 768 -b 768 -ub 768 keeps context and both batch sizes consistent, so no
# client-side truncation is needed for typical queries + child chunks.
# Reached by SoHoAI at http://192.168.1.95:8000/v1/rerank — llama-swap routes
# /v1/rerank by the request's "model" field, so this key must stay in sync with
# rag.rerank.model in SoHoAI-config.yaml.
  bge-reranker-v2-m3:
    cmd: |
      llama-server -m /mnt/nfs/Florian/Gin-AI/LLMs-cache/llama-server/bge-reranker-v2-m3-q8_0.gguf --load-mode none -ngl 99 -c 768 -b 768 -ub 768 --reranking --pooling rank --host 0.0.0.0 --port 8012
    proxy: http://127.0.0.1:8012
    ttl: 0  # never idle-evicted; its group is persistent, so neither the 9B nor the ASR group unloads it

#### Qwen3.5-9B-Q4
# Hybrid attention (full_attention_interval=4): only 8/32 layers store KV for all tokens.
# Effective KV/token (q8_0) = 2×8 layers×4 KV heads×256 head_dim×1.0625 = 17,408 bytes.
# MEASURED: @262144 ctx = 10,796 MiB, which CANNOT coexist with the reranker (llama-server
# segfaults during CUDA init). @131072 ctx = 8,382 MiB, which CAN: 9B + reranker + Ollama
# bge-m3 = 9,810 MiB of the card's 12,227, leaving 1,965 free. Verified 2026-09-17 by a
# 10-min concurrent soak (generation + rerank + embed): 30/30 samples, 0 errors.
# --reasoning off makes thinking-suppressed the default; a request carrying
# chat_template_kwargs.enable_thinking overrides it either way (see local/qwen3.5-9b-agentic
# in SoHoAI-config.yaml). This is the configuration that scored 0/150 on AYA Gate G0.
  qwen3.5-9b-q4:
    cmd: |
      llama-server -m /mnt/nfs/Florian/Gin-AI/LLMs-cache/llama-server/Qwen3.5-9B-UD-Q4_K_XL.gguf --jinja --reasoning off --flash-attn on --load-mode none --cache-type-k q8_0 --cache-type-v q8_0 -ngl 99 --ctx-size 131072 --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0 --host 0.0.0.0 --port 8011
    proxy: http://127.0.0.1:8011
    ttl: 0  # resident default since 2026-09-17 (was 300); routing.default_model points here

#### Qwen3-ASR-1.7B-Q8 -- AYA central ASR (added 2026-10-03; measured in the AYA v1.1-PhaseC1 bake-off)
# ggml-org/Qwen3-ASR-1.7B-GGUF: Q8_0 2.17 GB + mmproj Q8_0 356 MB. Needs llama.cpp >= 2026-05-15 (PR #23073,
# qwen3a preprocessing fix); system build a868c3e. MEASURED peak 4,810 MiB at --ctx-size 16384 (3,906 MiB at 8192);
# 16384 holds a 300 s audio chunk (~13 prompt tokens per second of audio) plus its transcript.
# Audio in via /v1/chat/completions content type "input_audio"; the reply starts "language <X><asr_text>".
  qwen3-asr-1.7b-q8:
    cmd: |
      llama-server -m /mnt/nfs/Florian/Gin-AI/LLMs-cache/llama-server/Qwen3-ASR-1.7B-Q8_0.gguf --mmproj /mnt/nfs/Florian/Gin-AI/LLMs-cache/llama-server/mmproj-Qwen3-ASR-1.7B-Q8_0.gguf --load-mode none -ngl 99 --ctx-size 16384 --temp 0 --host 0.0.0.0 --port 8013
    proxy: http://127.0.0.1:8013
    ttl: 0

groups:
#### Two mutually exclusive GPU tenants, each paired with the reranker (2026-10-03):
#   {qwen3.5-9b-q4 + bge-reranker-v2-m3}   or   {qwen3-asr-1.7b-q8 + bge-reranker-v2-m3}
# llama-swap v214 allows a model in only ONE group, so the reranker gets its own PERSISTENT group:
# an exclusive group stops every other group EXCEPT persistent ones (proxymanager.go swapProcessGroup:
# `if groupId != processGroup.id && !otherGroup.persistent`). Loading the 9B unloads Qwen3-ASR and vice
# versa; the reranker stays loaded throughout. VRAM: 9B 8,382 + reranker ~590 MiB; ASR 4,810 + ~590 MiB.
  reranker:
    members:
      - "bge-reranker-v2-m3"
    swap: false
    exclusive: false   # loading the reranker never unloads anything
    persistent: true   # and no other group may unload it
  resident:
    members:
      - "qwen3.5-9b-q4"
    swap: false
    exclusive: true    # loading the 9B unloads the asr group
  asr:
    members:
      - "qwen3-asr-1.7b-q8"
    swap: false
    exclusive: true    # loading Qwen3-ASR unloads the resident 9B

# The secret sauce for "Always On"
#### (!!!) 2026-05-16 :  Apparently this is NOT working yet -- i.e. there is no ability to bring back "default" model after TTL is expired -- 5mins for Qwen3.5-9B-Q4 -- and is removed from the GPU VRAM.
#### Leaving it commented though...
#### 2026-08-27 re-check: still no eviction hook in llama-swap v214 — the only hook
#### is hooks.on_startup.preload. After the 9B's TTL expires the GPU sits empty until
#### the next request, which then pays the cold-load cost (~48-64 s for the 9B over NFS,
#### ~15 s for the reranker). Both DO come back automatically, just lazily. Note both now
#### carry ttl: 0, so this only applies if something else evicts them.

# fallback:
#  default: "qwen3.5-9b-q4" # would reload the resident model after a TTL expiry — still unsupported

hooks:
  on_startup:
    preload:
      - "qwen3.5-9b-q4"       # boot the 9B (the resident default) on startup
      - "bge-reranker-v2-m3"  # ...and the reranker alongside it

